name: Deploy to Staging

on:
  push:
    branches:
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy-staging:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: staging
      url: https://staging-erp-invisible.tudominio.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ steps.vars.outputs.short_sha }}"
          # Aquí va tu lógica de deploy a staging:
          # - kubectl set image deployment/erp-invisible-staging erp-invisible=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ steps.vars.outputs.short_sha }}
          # - ssh deploy@staging-server "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging && docker-compose up -d"
      
      - name: Comment on commit
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            🚀 **Deployed to Staging**
            
            - **Image**: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ steps.vars.outputs.short_sha }}`
            - **Environment**: [Staging](https://staging-erp-invisible.tudominio.com)
            - **Commit**: ${{ github.sha }}
